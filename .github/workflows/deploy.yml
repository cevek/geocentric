name: Deploy to astro.cevek.xyz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-astro
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "144.31.122.253 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGHkwoLyYfOkLql2je84NqUQbrU7TpbumleDuUEaI3ql" >> ~/.ssh/known_hosts

      - name: Rsync to server
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            dist/ deploy@144.31.122.253:/var/www/astro.cevek.xyz/
